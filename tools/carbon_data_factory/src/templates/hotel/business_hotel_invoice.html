<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Business Hotel Invoice</title>
  <style>
    body { font-family: Verdana, sans-serif; margin: 40px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    .total { text-align: right; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Business Hotel Invoice</h1>
  <p>Hotel: {{hotel_name}}</p>
  <p>Guest: {{guest_name}}</p>
  <p>Company: {{company_name}}</p>
  <p>Stay: {{check_in}} – {{check_out}}</p>
  <table>
    <tr><th>Item</th><th>Amount (£)</th></tr>
    {{items}}
  </table>
  <p class="total">Subtotal: £{{subtotal}}</p>
  <p class="total">VAT ({{vat_rate}}%): £{{vat_amount}}</p>
  <p class="total">Total: £{{total}}</p>
</body>
</html>
