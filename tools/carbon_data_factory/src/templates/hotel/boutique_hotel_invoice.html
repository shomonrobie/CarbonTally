<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Boutique Hotel Invoice</title>
  <style>
    body { font-family: Georgia, serif; margin: 40px; background-color: #f9f9f9; }
    h1 { text-align: center; color: #444; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; }
    .total { text-align: right; font-weight: bold; }
  </style>
</head>
<body>
  <h1>{{hotel_name}} Boutique Stay</h1>
  <p>Guest: {{guest_name}}</p>
  <p>Stay: {{check_in}} – {{check_out}}</p>
  <table>
    <tr><th>Item</th><th>Amount (£)</th></tr>
    {{items}}
  </table>
  <p class="total">Total: £{{total}}</p>
  <p>Local Tax: £{{local_tax}}</p>
  <p>Final Amount: £{{final_amount}}</p>
  <p>We hope you enjoyed your stay!</p>
</body>
</html>
