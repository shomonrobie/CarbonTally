<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Luxury Hotel Invoice</title>
  <style>
    body { font-family: 'Times New Roman', serif; margin: 50px; }
    h1 { text-align: center; color: #800000; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #aaa; padding: 10px; }
    .total { text-align: right; font-weight: bold; }
  </style>
</head>
<body>
  <h1>{{hotel_name}} Luxury Resort</h1>
  <p>Guest: {{guest_name}}</p>
  <p>Stay: {{check_in}} – {{check_out}}</p>
  <table>
    <tr><th>Service</th><th>Amount (£)</th></tr>
    {{items}}
  </table>
  <p class="total">Subtotal: £{{subtotal}}</p>
  <p class="total">VAT ({{vat_rate}}%): £{{vat_amount}}</p>
  <p class="total">Total: £{{total}}</p>
  <p>Thank you for choosing {{hotel_name}}.</p>
</body>
</html>
