<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Budget Hotel Invoice</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 6px; }
  </style>
</head>
<body>
  <h1>Invoice</h1>
  <p>Hotel: {{hotel_name}}</p>
  <p>Guest: {{guest_name}}</p>
  <p>Stay: {{check_in}} – {{check_out}}</p>
  <table>
    <tr><th>Room</th><th>Nights</th><th>Total (£)</th></tr>
    <tr><td>{{room_type}}</td><td>{{nights}}</td><td>{{total}}</td></tr>
  </table>
</body>
</html>
