<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fuel Receipt</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { text-align: center; }
  </style>
</head>
<body>
  <h1>Fuel Receipt</h1>
  <p>Station: {{station_name}}</p>
  <p>Fuel Type: {{fuel_type}}</p>
  <p>Litres: {{litres}}</p>
  <p>Price per Litre: £{{price_per_litre}}</p>
  <p>Total: £{{total}}</p>
  <p>Emission Factor: {{emission_factor}} kgCO₂/litre</p>
</body>
</html>
