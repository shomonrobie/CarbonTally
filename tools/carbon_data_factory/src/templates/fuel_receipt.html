<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fuel Receipt</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; }
    h1 { text-align: center; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
  </style>
</head>
<body>
  <h1>Fuel Receipt</h1>
  <p>Station: {{station_name}}</p>
  <p>Location: {{station_location}}</p>
  <p>Date: {{purchase_date}}</p>
  <table>
    <tr><th>Fuel Type</th><th>Litres</th><th>Rate (£/litre)</th><th>Total (£)</th></tr>
    <tr><td>{{fuel_type}}</td><td>{{litres}}</td><td>{{rate}}</td><td>{{total}}</td></tr>
  </table>
  <p>Grand Total: £{{grand_total}}</p>
  <p>Transaction ID: {{transaction_id}}</p>
</body>
</html>
