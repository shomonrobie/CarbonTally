<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarbonTally · User Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== THEME SYSTEM ===== */
        :root {
            --primary: 150, 50%, 28%;
            --primary-foreground: 0, 0%, 100%;
            --secondary: 220, 14%, 45%;
            --secondary-foreground: 0, 0%, 100%;
            --accent: 150, 30%, 92%;
            --accent-foreground: 150, 50%, 28%;
            --muted: 220, 15%, 96%;
            --muted-foreground: 220, 14%, 45%;
            --background: 0, 0%, 100%;
            --foreground: 220, 20%, 18%;
            --card: 0, 0%, 100%;
            --card-foreground: 220, 20%, 18%;
            --border: 220, 15%, 90%;
            --ring: 150, 50%, 28%;
            --success: 150, 30%, 35%;
            --warning: 38, 60%, 45%;
            --destructive: 0, 50%, 40%;
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
            --sidebar-width: 240px;
            --sidebar-bg: 0, 0%, 100%;
            --sidebar-border: 220, 15%, 90%;
            --sidebar-item-hover: 150, 30%, 96%;
            --sidebar-item-active: 150, 50%, 28%;
        }

        [data-theme="forest"] { --primary: 150, 50%, 28%; --accent: 150, 30%, 92%; }
        [data-theme="emerald"] { --primary: 160, 84%, 39%; --accent: 160, 70%, 92%; }
        [data-theme="teal"] { --primary: 175, 60%, 25%; --accent: 175, 50%, 90%; }
        [data-theme="navy"] { --primary: 222, 47%, 31%; --accent: 222, 40%, 90%; }
        [data-theme="slate"] { --primary: 220, 20%, 18%; --accent: 220, 20%, 92%; }
        [data-theme="warm-grey"] { --primary: 30, 15%, 25%; --accent: 30, 20%, 92%; }
        [data-theme="purple"] { --primary: 260, 50%, 35%; --accent: 260, 40%, 90%; }
        [data-theme="rose"] { --primary: 340, 60%, 35%; --accent: 340, 50%, 92%; }
        [data-theme="carbon"] { --primary: 0, 0%, 15%; --accent: 0, 0%, 92%; }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: hsl(var(--background));
            color: hsl(var(--foreground));
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
            border: none; cursor: pointer; transition: all 0.15s ease;
        }
        .btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
        .btn-primary:hover { opacity:0.9; box-shadow: 0 4px 12px hsla(var(--primary),0.3); transform:translateY(-1px); }
        .btn-outline { background:transparent; color:hsl(var(--primary)); border:2px solid hsl(var(--primary)); }
        .btn-outline:hover { background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); }
        .btn-ghost { background:transparent; color:hsl(var(--foreground)); }
        .btn-ghost:hover { background:hsl(var(--accent)); }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .btn-success { background:hsl(var(--success)); color:#fff; }
        .btn-danger { background:hsl(var(--destructive)); color:#fff; }
        .btn-secondary { background:hsl(var(--secondary)); color:#fff; }

        .card {
            background: hsl(var(--card)); border-radius: var(--radius); border:1px solid hsl(var(--border));
            box-shadow: var(--shadow); transition: all 0.2s ease;
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card-header { padding: 16px 20px 8px 20px; display:flex; justify-content:space-between; align-items:center; }
        .card-title { font-size:14px; font-weight:600; }
        .card-description { font-size:12px; color:hsl(var(--muted-foreground)); }
        .card-content { padding: 12px 20px 20px 20px; }

        .badge {
            display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px;
            font-size:11px; font-weight:500;
        }
        .badge-success { background:hsl(var(--success)); color:#fff; }
        .badge-warning { background:hsl(var(--warning)); color:#fff; }
        .badge-primary { background:hsl(var(--primary)); color:#fff; }
        .badge-muted { background:hsl(var(--muted)); color:hsl(var(--muted-foreground)); }
        .badge-destructive { background:hsl(var(--destructive)); color:#fff; }
        .badge-secondary { background:hsl(var(--secondary)); color:#fff; }

        .avatar {
            width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-weight:600; font-size:14px; background:hsl(var(--primary)); color:#fff; flex-shrink:0;
        }
        .avatar-lg { width:80px; height:80px; font-size:32px; }

        .app { display:flex; min-height:100vh; }
        .sidebar {
            width: var(--sidebar-width); background:hsl(var(--sidebar-bg)); border-right:1px solid hsl(var(--sidebar-border));
            display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:100;
            transition:all 0.3s ease; overflow-y:auto;
        }
        .sidebar-logo { padding:20px 20px 16px 20px; display:flex; align-items:center; gap:10px; border-bottom:1px solid hsl(var(--sidebar-border)); }
        .sidebar-logo .logo-icon { width:32px; height:32px; background:hsl(var(--primary)); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
        .sidebar-logo .logo-text { font-size:18px; font-weight:700; }
        .sidebar-nav { flex:1; padding:16px 12px; overflow-y:auto; }
        .sidebar-section-title { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:hsl(var(--muted-foreground)); padding:8px 12px 4px 12px; opacity:0.6; }
        .sidebar-item {
            display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:var(--radius);
            color:hsl(var(--muted-foreground)); cursor:pointer; transition:all 0.15s ease; font-size:14px; font-weight:500;
            border:none; background:transparent; width:100%; text-align:left;
        }
        .sidebar-item:hover { background:hsl(var(--sidebar-item-hover)); color:hsl(var(--foreground)); }
        .sidebar-item.active { background:hsl(var(--sidebar-item-active)); color:#fff; }
        .sidebar-item .icon { font-size:18px; width:24px; text-align:center; flex-shrink:0; }
        .sidebar-item .badge { margin-left:auto; }

        .main-content { margin-left:var(--sidebar-width); flex:1; min-height:100vh; display:flex; flex-direction:column; }
        .top-header {
            background:hsl(var(--card)); border-bottom:1px solid hsl(var(--border)); padding:0 32px; height:64px;
            display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50;
        }
        .header-left { display:flex; align-items:center; gap:24px; flex:1; }
        .header-search { flex:1; max-width:400px; position:relative; margin:0 24px; }
        .header-search input { width:100%; padding:8px 12px 8px 36px; border-radius:var(--radius); border:1px solid hsl(var(--border)); background:hsl(var(--background)); font-size:13px; outline:none; }
        .header-search input:focus { border-color:hsl(var(--ring)); box-shadow:0 0 0 3px hsla(var(--ring),0.15); }
        .header-search .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:hsl(var(--muted-foreground)); }
        .header-right { display:flex; align-items:center; gap:16px; }
        .header-user { display:flex; align-items:center; gap:8px; cursor:pointer; padding:4px 8px 4px 4px; border-radius:var(--radius); }
        .header-user:hover { background:hsl(var(--accent)); }
        .header-user .user-name { font-size:13px; font-weight:500; }
        .header-user .user-role { font-size:11px; color:hsl(var(--muted-foreground)); }
        .mobile-menu-btn { display:none; background:none; border:none; font-size:24px; cursor:pointer; }

        .main-body { padding:24px 32px; flex:1; }
        .page-header { margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
        .page-header h1 { font-size:24px; font-weight:700; }
        .page-header p { font-size:14px; color:hsl(var(--muted-foreground)); margin-top:2px; }

        .theme-btn { padding:4px 10px; border-radius:var(--radius); border:1px solid hsl(var(--border)); background:hsl(var(--background)); cursor:pointer; font-size:12px; display:flex; align-items:center; gap:4px; }

        /* Profile specific styles */
        .profile-layout {
            display:grid; grid-template-columns:320px 1fr; gap:24px;
        }
        .profile-sidebar .profile-card { text-align:center; }
        .profile-avatar { margin:0 auto 16px; }
        .profile-name { font-size:20px; font-weight:700; }
        .profile-role { font-size:14px; color:hsl(var(--muted-foreground)); }
        .profile-stats { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; }
        .profile-stat { background:hsl(var(--muted)); border-radius:var(--radius); padding:12px; text-align:center; }
        .profile-stat .stat-value { font-size:18px; font-weight:700; }
        .profile-stat .stat-label { font-size:11px; color:hsl(var(--muted-foreground)); }

        .profile-menu { margin-top:16px; }
        .profile-menu-item {
            display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--radius);
            cursor:pointer; transition:all 0.15s ease; border:none; background:transparent; width:100%; text-align:left;
            color:hsl(var(--muted-foreground)); font-size:13px;
        }
        .profile-menu-item:hover { background:hsl(var(--accent)); color:hsl(var(--foreground)); }
        .profile-menu-item.active { background:hsl(var(--accent)); color:hsl(var(--foreground)); font-weight:500; }
        .profile-menu-item .menu-icon { width:20px; text-align:center; }

        .activity-item {
            display:flex; gap:12px; padding:10px 0; border-bottom:1px solid hsl(var(--border));
        }
        .activity-item:last-child { border-bottom:none; }
        .activity-item .activity-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; background:hsl(var(--muted)); }
        .activity-item .activity-content { flex:1; }
        .activity-item .activity-content .title { font-size:13px; font-weight:500; }
        .activity-item .activity-content .desc { font-size:12px; color:hsl(var(--muted-foreground)); }
        .activity-item .activity-content .time { font-size:11px; color:hsl(var(--muted-foreground)); }

        .settings-group { margin-bottom:20px; }
        .settings-group label { display:block; font-weight:500; margin-bottom:4px; font-size:13px; }
        .settings-group input, .settings-group select, .settings-group textarea { width:100%; padding:8px 12px; border-radius:var(--radius); border:1px solid hsl(var(--border)); background:hsl(var(--background)); font-size:13px; outline:none; font-family:inherit; }
        .settings-group input:focus, .settings-group select:focus, .settings-group textarea:focus { border-color:hsl(var(--ring)); box-shadow:0 0 0 3px hsla(var(--ring),0.15); }
        .settings-group .hint { font-size:11px; color:hsl(var(--muted-foreground)); margin-top:2px; }

        .toggle-switch { position:relative; display:inline-block; width:44px; height:24px; }
        .toggle-switch input { opacity:0; width:0; height:0; }
        .toggle-slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:hsl(var(--muted)); border-radius:24px; transition:0.3s; }
        .toggle-slider:before { content:""; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:#fff; border-radius:50%; transition:0.3s; }
        .toggle-switch input:checked + .toggle-slider { background:hsl(var(--primary)); }
        .toggle-switch input:checked + .toggle-slider:before { transform:translateX(20px); }

        /* Modal */
        .modal-overlay {
            display:none; position:fixed; inset:0; background:rgba(0,0,0,0.4); backdrop-filter:blur(4px);
            z-index:1000; align-items:center; justify-content:center;
        }
        .modal-overlay.show { display:flex; }
        .modal-box {
            background:hsl(var(--card)); border-radius:var(--radius); border:1px solid hsl(var(--border));
            box-shadow:var(--shadow-lg); max-width:600px; width:95%; max-height:85vh; overflow-y:auto;
            padding:24px; animation:slideUp 0.2s ease;
        }
        .modal-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
        .modal-title { font-size:20px; font-weight:700; }
        .modal-close { background:none; border:none; font-size:24px; cursor:pointer; color:hsl(var(--muted-foreground)); }
        .modal-footer { display:flex; justify-content:flex-end; gap:8px; padding-top:16px; border-top:1px solid hsl(var(--border)); margin-top:16px; }

        @keyframes slideUp { from { transform:translateY(20px); opacity:0; } to { transform:translateY(0); opacity:1; } }

        @media (max-width:1200px) {
            .profile-layout { grid-template-columns:1fr; }
        }
        @media (max-width:992px) {
            .sidebar { transform:translateX(-100%); width:280px; }
            .sidebar.open { transform:translateX(0); }
            .main-content { margin-left:0; }
            .top-header { padding:0 16px; }
            .main-body { padding:16px; }
            .header-search { display:none; }
            .mobile-menu-btn { display:flex !important; }
        }
        @media (max-width:768px) {
            .profile-stats { grid-template-columns:1fr 1fr; }
        }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><div class="logo-icon">🌱</div><span class="logo-text">CarbonTally</span></div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-title">Main</div>
            <button class="sidebar-item"><span class="icon">🏠</span> Dashboard</button>
            <button class="sidebar-item"><span class="icon">📁</span> Documents</button>
            <button class="sidebar-item"><span class="icon">📦</span> Batch Management</button>
            <button class="sidebar-item active"><span class="icon">👤</span> Profile</button>
            <button class="sidebar-item"><span class="icon">📊</span> Compliance</button>
            <button class="sidebar-item"><span class="icon">💬</span> Messaging</button>
            <div class="sidebar-section-title" style="margin-top:16px;">Admin</div>
            <button class="sidebar-item"><span class="icon">📋</span> Audit Logs</button>
            <button class="sidebar-item"><span class="icon">⚙️</span> Settings</button>
        </nav>
        <div style="padding:16px 20px; border-top:1px solid hsl(var(--sidebar-border));">
            <button class="sidebar-item"><span class="icon">❓</span> Help</button>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <div class="header-search"><span class="search-icon">🔍</span><input type="text" placeholder="Search..." id="globalSearch" /></div>
            </div>
            <div class="header-right">
                <button class="theme-btn" id="themeToggle"><i class="fas fa-palette"></i> <span id="currentThemeName">Forest</span></button>
                <div class="header-user"><div class="avatar">JD</div><div><div class="user-name">John Doe</div><div class="user-role">Admin</div></div></div>
            </div>
        </header>

        <div class="main-body" id="mainBody">
            <!-- Rendered by JS -->
        </div>
    </div>
</div>

<!-- ===== EDIT PROFILE MODAL ===== -->
<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <div class="modal-header">
            <div class="modal-title"><i class="fas fa-user-edit"></i> Edit Profile</div>
            <button class="modal-close" id="modalCloseBtn">&times;</button>
        </div>
        <div class="modal-body" id="editModalBody">
            <!-- Rendered by JS -->
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" id="modalCancelBtn">Cancel</button>
            <button class="btn btn-primary" id="modalSaveBtn"><i class="fas fa-save"></i> Save Changes</button>
        </div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ===== THEMES =====
        const themes = [
            { id: 'forest', name: 'Forest Green' },
            { id: 'emerald', name: 'Emerald' },
            { id: 'teal', name: 'Teal' },
            { id: 'navy', name: 'Navy' },
            { id: 'slate', name: 'Slate' },
            { id: 'warm-grey', name: 'Warm Grey' },
            { id: 'purple', name: 'Purple' },
            { id: 'rose', name: 'Rose' },
            { id: 'carbon', name: 'Carbon' }
        ];
        let currentTheme = localStorage.getItem('carbontally-theme') || 'forest';

        function setTheme(id) {
            currentTheme = id;
            document.documentElement.setAttribute('data-theme', id);
            localStorage.setItem('carbontally-theme', id);
            const t = themes.find(th => th.id === id);
            if (t) document.getElementById('currentThemeName').textContent = t.name;
        }
        setTheme(currentTheme);

        document.getElementById('themeToggle').addEventListener('click', function() {
            const idx = themes.findIndex(t => t.id === currentTheme);
            const next = (idx + 1) % themes.length;
            setTheme(themes[next].id);
        });

        // ===== MOCK DATA =====

        const userProfile = {
            id: 'u1',
            firstName: 'John',
            lastName: 'Doe',
            email: 'john.doe@carbontally.com',
            role: 'Admin',
            department: 'Sustainability',
            joinDate: '2024-01-15',
            status: 'active',
            avatar: 'JD',
            bio: 'Sustainability professional with 10+ years experience in carbon accounting and ESG reporting. Passionate about helping organizations achieve their net-zero goals.',
            location: 'London, UK',
            phone: '+44 20 1234 5678',
            company: 'CarbonTally Ltd',
            jobTitle: 'Senior Sustainability Manager',
            preferences: {
                theme: 'light',
                notifications: true,
                emailUpdates: true,
                language: 'en',
                timezone: 'GMT',
                dateFormat: 'DD/MM/YYYY'
            }
        };

        const activityHistory = [
            { id: 'a1', type: 'login', icon: 'fa-sign-in-alt', title: 'Logged in', desc: 'From IP 192.168.1.1', time: '2 hours ago' },
            { id: 'a2', type: 'document', icon: 'fa-file-upload', title: 'Uploaded SECR Report', desc: 'Q4 2026 SECR documentation', time: '4 hours ago' },
            { id: 'a3', type: 'compliance', icon: 'fa-check-circle', title: 'Approved CSRD Data', desc: 'Verified Scope 2 emissions', time: '1 day ago' },
            { id: 'a4', type: 'message', icon: 'fa-comment', title: 'Sent message to Sarah', desc: 'Regarding SECR review', time: '1 day ago' },
            { id: 'a5', type: 'settings', icon: 'fa-cog', title: 'Updated preferences', desc: 'Changed notification settings', time: '2 days ago' },
            { id: 'a6', type: 'document', icon: 'fa-file-pdf', title: 'Generated GHG Report', desc: 'Annual emissions inventory', time: '3 days ago' },
            { id: 'a7', type: 'login', icon: 'fa-sign-out-alt', title: 'Logged out', desc: 'Session ended', time: '3 days ago' },
            { id: 'a8', type: 'compliance', icon: 'fa-exclamation-triangle', title: 'Reviewed ISSB findings', desc: '3 data points need attention', time: '4 days ago' },
            { id: 'a9', type: 'settings', icon: 'fa-user-plus', title: 'Added team member', desc: 'Alex Rivera joined as Analyst', time: '5 days ago' },
            { id: 'a10', type: 'document', icon: 'fa-file-excel', title: 'Exported emission data', desc: 'Q4 2026 emissions export', time: '6 days ago' },
        ];

        const performanceStats = {
            totalReviews: 342,
            accuracyRate: 94.7,
            avgReviewTime: '8.5 min',
            documentsProcessed: 2156,
            complianceScore: 98,
            teamRank: 2
        };

        // ===== STATE =====
        let currentSection = 'profile';
        let editedProfile = { ...userProfile };

        // ===== DOM REFS =====
        const mainBody = document.getElementById('mainBody');
        const editModal = document.getElementById('editModal');
        const editModalBody = document.getElementById('editModalBody');

        // ===== RENDER FUNCTIONS =====

        function renderProfile() {
            const p = userProfile;
            const stats = performanceStats;

            const html = `
                <div class="page-header">
                    <div><h1>👤 User Profile</h1><p>Manage your profile, preferences, and activity history.</p></div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-primary btn-sm" onclick="openEditModal()"><i class="fas fa-edit"></i> Edit Profile</button>
                    </div>
                </div>

                <div class="profile-layout">
                    <!-- Left Column - Profile Card -->
                    <div class="profile-sidebar">
                        <div class="card profile-card">
                            <div class="card-content">
                                <div class="profile-avatar">
                                    <div class="avatar avatar-lg" style="margin:0 auto;">${p.avatar}</div>
                                </div>
                                <div class="profile-name">${p.firstName} ${p.lastName}</div>
                                <div class="profile-role">${p.jobTitle || p.role} · ${p.department}</div>
                                <div style="margin-top:4px;">
                                    <span class="badge badge-success"><i class="fas fa-circle" style="font-size:8px;"></i> ${p.status}</span>
                                </div>
                                <div style="margin-top:8px;font-size:13px;color:hsl(var(--muted-foreground));">
                                    <div><i class="fas fa-envelope"></i> ${p.email}</div>
                                    <div><i class="fas fa-map-marker-alt"></i> ${p.location}</div>
                                    <div><i class="fas fa-phone"></i> ${p.phone}</div>
                                    <div><i class="fas fa-building"></i> ${p.company}</div>
                                    <div><i class="fas fa-calendar-alt"></i> Joined ${p.joinDate}</div>
                                </div>
                                <div style="margin-top:12px;padding-top:12px;border-top:1px solid hsl(var(--border));">
                                    <div style="font-size:13px;text-align:left;">${p.bio}</div>
                                </div>
                            </div>
                        </div>

                        <!-- Profile Menu -->
                        <div class="card" style="margin-top:16px;">
                            <div class="card-content" style="padding:8px 12px;">
                                <div class="profile-menu">
                                    <button class="profile-menu-item active" onclick="switchSection('profile')">
                                        <span class="menu-icon"><i class="fas fa-user"></i></span> Profile
                                    </button>
                                    <button class="profile-menu-item" onclick="switchSection('activity')">
                                        <span class="menu-icon"><i class="fas fa-history"></i></span> Activity History
                                    </button>
                                    <button class="profile-menu-item" onclick="switchSection('preferences')">
                                        <span class="menu-icon"><i class="fas fa-sliders-h"></i></span> Preferences
                                    </button>
                                    <button class="profile-menu-item" onclick="switchSection('security')">
                                        <span class="menu-icon"><i class="fas fa-shield-alt"></i></span> Security
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column - Content -->
                    <div id="profileContent">
                        ${currentSection === 'profile' ? renderProfileContent() : ''}
                        ${currentSection === 'activity' ? renderActivityContent() : ''}
                        ${currentSection === 'preferences' ? renderPreferencesContent() : ''}
                        ${currentSection === 'security' ? renderSecurityContent() : ''}
                    </div>
                </div>
            `;

            mainBody.innerHTML = html;
        }

        function renderProfileContent() {
            const stats = performanceStats;
            return `
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:20px;">
                    <div class="card">
                        <div class="card-header"><div class="card-title">📊 Performance Overview</div></div>
                        <div class="card-content">
                            <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                                <div style="text-align:center;padding:12px;background:hsl(var(--muted));border-radius:var(--radius);">
                                    <div style="font-size:24px;font-weight:700;color:hsl(var(--primary));">${stats.totalReviews}</div>
                                    <div style="font-size:11px;color:hsl(var(--muted-foreground));">Total Reviews</div>
                                </div>
                                <div style="text-align:center;padding:12px;background:hsl(var(--muted));border-radius:var(--radius);">
                                    <div style="font-size:24px;font-weight:700;color:hsl(var(--success));">${stats.accuracyRate}%</div>
                                    <div style="font-size:11px;color:hsl(var(--muted-foreground));">Accuracy Rate</div>
                                </div>
                                <div style="text-align:center;padding:12px;background:hsl(var(--muted));border-radius:var(--radius);">
                                    <div style="font-size:24px;font-weight:700;color:hsl(var(--warning));">${stats.avgReviewTime}</div>
                                    <div style="font-size:11px;color:hsl(var(--muted-foreground));">Avg Review Time</div>
                                </div>
                                <div style="text-align:center;padding:12px;background:hsl(var(--muted));border-radius:var(--radius);">
                                    <div style="font-size:24px;font-weight:700;color:hsl(var(--primary));">${stats.documentsProcessed}</div>
                                    <div style="font-size:11px;color:hsl(var(--muted-foreground));">Documents Processed</div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><div class="card-title">🏆 Achievements</div></div>
                        <div class="card-content">
                            <div style="display:flex;flex-direction:column;gap:8px;">
                                <div style="display:flex;align-items:center;gap:12px;padding:8px;background:hsl(var(--muted));border-radius:var(--radius);">
                                    <span style="font-size:24px;">🥇</span>
                                    <div>
                                        <div style="font-weight:500;">Top Performer</div>
                                        <div style="font-size:12px;color:hsl(var(--muted-foreground));">Ranked #${stats.teamRank} in team</div>
                                    </div>
                                </div>
                                <div style="display:flex;align-items:center;gap:12px;padding:8px;background:hsl(var(--muted));border-radius:var(--radius);">
                                    <span style="font-size:24px;">🎯</span>
                                    <div>
                                        <div style="font-weight:500;">Compliance Expert</div>
                                        <div style="font-size:12px;color:hsl(var(--muted-foreground));">${stats.complianceScore}% compliance score</div>
                                    </div>
                                </div>
                                <div style="display:flex;align-items:center;gap:12px;padding:8px;background:hsl(var(--muted));border-radius:var(--radius);">
                                    <span style="font-size:24px;">📚</span>
                                    <div>
                                        <div style="font-weight:500;">Knowledge Leader</div>
                                        <div style="font-size:12px;color:hsl(var(--muted-foreground));">${stats.documentsProcessed} documents reviewed</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-header"><div class="card-title">📈 Recent Activity</div></div>
                    <div class="card-content">
                        ${activityHistory.slice(0, 5).map(a => `
                            <div class="activity-item">
                                <div class="activity-icon"><i class="fas ${a.icon}"></i></div>
                                <div class="activity-content">
                                    <div class="title">${a.title}</div>
                                    <div class="desc">${a.desc}</div>
                                    <div class="time">${a.time}</div>
                                </div>
                            </div>
                        `).join('')}
                        <div style="margin-top:8px;">
                            <button class="btn btn-sm btn-ghost" onclick="switchSection('activity')">View All Activity →</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderActivityContent() {
            return `
                <div class="card">
                    <div class="card-header">
                        <div class="card-title">📋 Activity History</div>
                        <span class="badge badge-primary">${activityHistory.length} events</span>
                    </div>
                    <div class="card-content">
                        ${activityHistory.map(a => `
                            <div class="activity-item">
                                <div class="activity-icon"><i class="fas ${a.icon}"></i></div>
                                <div class="activity-content">
                                    <div class="title">${a.title}</div>
                                    <div class="desc">${a.desc}</div>
                                    <div class="time">${a.time}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderPreferencesContent() {
            const prefs = userProfile.preferences;
            return `
                <div class="card">
                    <div class="card-header"><div class="card-title">⚙️ Preferences</div></div>
                    <div class="card-content">
                        <div class="settings-group">
                            <label>Language</label>
                            <select>
                                <option value="en" ${prefs.language === 'en' ? 'selected' : ''}>English</option>
                                <option value="es" ${prefs.language === 'es' ? 'selected' : ''}>Spanish</option>
                                <option value="fr" ${prefs.language === 'fr' ? 'selected' : ''}>French</option>
                                <option value="de" ${prefs.language === 'de' ? 'selected' : ''}>German</option>
                            </select>
                        </div>
                        <div class="settings-group">
                            <label>Timezone</label>
                            <select>
                                <option value="GMT" ${prefs.timezone === 'GMT' ? 'selected' : ''}>GMT (UTC+0)</option>
                                <option value="EST" ${prefs.timezone === 'EST' ? 'selected' : ''}>EST (UTC-5)</option>
                                <option value="CET" ${prefs.timezone === 'CET' ? 'selected' : ''}>CET (UTC+1)</option>
                                <option value="PST" ${prefs.timezone === 'PST' ? 'selected' : ''}>PST (UTC-8)</option>
                            </select>
                        </div>
                        <div class="settings-group">
                            <label>Date Format</label>
                            <select>
                                <option value="DD/MM/YYYY" ${prefs.dateFormat === 'DD/MM/YYYY' ? 'selected' : ''}>DD/MM/YYYY</option>
                                <option value="MM/DD/YYYY" ${prefs.dateFormat === 'MM/DD/YYYY' ? 'selected' : ''}>MM/DD/YYYY</option>
                                <option value="YYYY-MM-DD" ${prefs.dateFormat === 'YYYY-MM-DD' ? 'selected' : ''}>YYYY-MM-DD</option>
                            </select>
                        </div>
                        <div style="margin-top:16px;padding-top:16px;border-top:1px solid hsl(var(--border));">
                            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;">
                                <div>
                                    <div style="font-weight:500;">Email Notifications</div>
                                    <div style="font-size:12px;color:hsl(var(--muted-foreground));">Receive email updates about activity</div>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" ${prefs.emailUpdates ? 'checked' : ''} />
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;">
                                <div>
                                    <div style="font-weight:500;">Push Notifications</div>
                                    <div style="font-size:12px;color:hsl(var(--muted-foreground));">Receive push notifications in browser</div>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" ${prefs.notifications ? 'checked' : ''} />
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                        </div>
                        <div style="margin-top:16px;">
                            <button class="btn btn-primary" onclick="alert('✅ Preferences saved successfully!')"><i class="fas fa-save"></i> Save Preferences</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSecurityContent() {
            return `
                <div class="card">
                    <div class="card-header"><div class="card-title">🔒 Security Settings</div></div>
                    <div class="card-content">
                        <div class="settings-group">
                            <label>Current Password</label>
                            <input type="password" value="••••••••" disabled />
                        </div>
                        <div class="settings-group">
                            <label>New Password</label>
                            <input type="password" placeholder="Enter new password" />
                        </div>
                        <div class="settings-group">
                            <label>Confirm New Password</label>
                            <input type="password" placeholder="Confirm new password" />
                        </div>
                        <div style="margin-top:16px;padding-top:16px;border-top:1px solid hsl(var(--border));">
                            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;">
                                <div>
                                    <div style="font-weight:500;">Two-Factor Authentication</div>
                                    <div style="font-size:12px;color:hsl(var(--muted-foreground));">Add an extra layer of security</div>
                                </div>
                                <label class="toggle-switch">
                                    <input type="checkbox" />
                                    <span class="toggle-slider"></span>
                                </label>
                            </div>
                            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;">
                                <div>
                                    <div style="font-weight:500;">Session Management</div>
                                    <div style="font-size:12px;color:hsl(var(--muted-foreground));">Active sessions: 2</div>
                                </div>
                                <button class="btn btn-sm btn-outline" onclick="alert('🔄 All sessions terminated')">Logout All</button>
                            </div>
                        </div>
                        <div style="margin-top:16px;display:flex;gap:8px;">
                            <button class="btn btn-primary" onclick="alert('✅ Password updated successfully!')"><i class="fas fa-save"></i> Update Password</button>
                            <button class="btn btn-danger" onclick="if(confirm('Are you sure?')) alert('🗑️ Account deactivated')"><i class="fas fa-trash"></i> Deactivate Account</button>
                        </div>
                    </div>
                </div>
            `;
        }

        // ===== EDIT MODAL =====
        window.openEditModal = function() {
            // Populate modal with current profile data
            const p = userProfile;
            editModalBody.innerHTML = `
                <div class="settings-group">
                    <label>First Name</label>
                    <input type="text" id="editFirstName" value="${p.firstName}" />
                </div>
                <div class="settings-group">
                    <label>Last Name</label>
                    <input type="text" id="editLastName" value="${p.lastName}" />
                </div>
                <div class="settings-group">
                    <label>Email Address</label>
                    <input type="email" id="editEmail" value="${p.email}" />
                </div>
                <div class="settings-group">
                    <label>Job Title</label>
                    <input type="text" id="editJobTitle" value="${p.jobTitle || ''}" />
                </div>
                <div class="settings-group">
                    <label>Department</label>
                    <input type="text" id="editDepartment" value="${p.department}" />
                </div>
                <div class="settings-group">
                    <label>Company</label>
                    <input type="text" id="editCompany" value="${p.company}" />
                </div>
                <div class="settings-group">
                    <label>Phone Number</label>
                    <input type="text" id="editPhone" value="${p.phone}" />
                </div>
                <div class="settings-group">
                    <label>Location</label>
                    <input type="text" id="editLocation" value="${p.location}" />
                </div>
                <div class="settings-group">
                    <label>Bio</label>
                    <textarea id="editBio" rows="3">${p.bio}</textarea>
                    <div class="hint">Brief description about yourself</div>
                </div>
                <div class="settings-group">
                    <label>Status</label>
                    <select id="editStatus">
                        <option value="active" ${p.status === 'active' ? 'selected' : ''}>Active</option>
                        <option value="inactive" ${p.status === 'inactive' ? 'selected' : ''}>Inactive</option>
                        <option value="suspended" ${p.status === 'suspended' ? 'selected' : ''}>Suspended</option>
                    </select>
                </div>
            `;
            editModal.classList.add('show');
        };

        function closeEditModal() {
            editModal.classList.remove('show');
        }

        function saveProfile() {
            const p = userProfile;
            // Get values from form
            const firstName = document.getElementById('editFirstName').value.trim();
            const lastName = document.getElementById('editLastName').value.trim();
            const email = document.getElementById('editEmail').value.trim();
            const jobTitle = document.getElementById('editJobTitle').value.trim();
            const department = document.getElementById('editDepartment').value.trim();
            const company = document.getElementById('editCompany').value.trim();
            const phone = document.getElementById('editPhone').value.trim();
            const location = document.getElementById('editLocation').value.trim();
            const bio = document.getElementById('editBio').value.trim();
            const status = document.getElementById('editStatus').value;

            // Validate
            if (!firstName || !lastName || !email) {
                alert('⚠️ Please fill in all required fields (First Name, Last Name, Email)');
                return;
            }

            // Update profile
            p.firstName = firstName;
            p.lastName = lastName;
            p.email = email;
            p.jobTitle = jobTitle || p.jobTitle;
            p.department = department || p.department;
            p.company = company || p.company;
            p.phone = phone || p.phone;
            p.location = location || p.location;
            p.bio = bio || p.bio;
            p.status = status;
            p.avatar = firstName[0] + lastName[0];

            closeEditModal();
            renderProfile();
            // Update header avatar
            document.querySelector('.header-user .avatar').textContent = p.avatar;
            document.querySelector('.header-user .user-name').textContent = `${p.firstName} ${p.lastName}`;

            // Show success message
            showToast('✅ Profile updated successfully!');
        }

        // ===== TOAST =====
        function showToast(message) {
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed; bottom: 24px; right: 24px; 
                background: hsl(var(--card)); border: 1px solid hsl(var(--border));
                border-radius: var(--radius); padding: 12px 20px;
                box-shadow: var(--shadow-lg); z-index: 2000;
                font-size: 14px; color: hsl(var(--foreground));
                animation: slideUp 0.3s ease;
                max-width: 400px;
            `;
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // ===== SECTION SWITCHER =====
        window.switchSection = function(section) {
            currentSection = section;
            // Update menu items
            document.querySelectorAll('.profile-menu-item').forEach(el => {
                el.classList.remove('active');
            });
            const menuItems = document.querySelectorAll('.profile-menu-item');
            const index = { 'profile': 0, 'activity': 1, 'preferences': 2, 'security': 3 };
            if (menuItems[index[section]]) {
                menuItems[index[section]].classList.add('active');
            }
            renderProfile();
        };

        // ===== EVENT LISTENERS =====

        // Modal close
        document.getElementById('modalCloseBtn').addEventListener('click', closeEditModal);
        document.getElementById('modalCancelBtn').addEventListener('click', closeEditModal);
        document.getElementById('modalSaveBtn').addEventListener('click', saveProfile);
        editModal.addEventListener('click', function(e) {
            if (e.target === this) closeEditModal();
        });

        // Keyboard shortcut - Escape to close modal
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && editModal.classList.contains('show')) {
                closeEditModal();
            }
        });

        // Mobile menu
        document.getElementById('mobileMenuBtn').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // ===== INIT =====
        renderProfile();

        console.log('👤 CarbonTally - User Profile Module Loaded');
        console.log('📊 Showing profile for ' + userProfile.firstName + ' ' + userProfile.lastName);
        console.log('📈 ' + activityHistory.length + ' activities tracked');

    })();
</script>
</body>
</html>
