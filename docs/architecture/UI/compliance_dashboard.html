<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarbonTally · Compliance Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== THEME SYSTEM (exact CarbonTally) ===== */
        :root {
            --primary: 150, 50%, 28%;
            --primary-foreground: 0, 0%, 100%;
            --secondary: 220, 14%, 45%;
            --secondary-foreground: 0, 0%, 100%;
            --accent: 150, 30%, 92%;
            --accent-foreground: 150, 50%, 28%;
            --muted: 220, 15%, 96%;
            --muted-foreground: 220, 14%, 45%;
            --background: 0, 0%, 100%;
            --foreground: 220, 20%, 18%;
            --card: 0, 0%, 100%;
            --card-foreground: 220, 20%, 18%;
            --border: 220, 15%, 90%;
            --ring: 150, 50%, 28%;
            --success: 150, 30%, 35%;
            --warning: 38, 60%, 45%;
            --destructive: 0, 50%, 40%;
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
            --sidebar-width: 240px;
            --sidebar-bg: 0, 0%, 100%;
            --sidebar-border: 220, 15%, 90%;
            --sidebar-item-hover: 150, 30%, 96%;
            --sidebar-item-active: 150, 50%, 28%;
        }

        [data-theme="forest"] { --primary: 150, 50%, 28%; --accent: 150, 30%, 92%; }
        [data-theme="emerald"] { --primary: 160, 84%, 39%; --accent: 160, 70%, 92%; }
        [data-theme="teal"] { --primary: 175, 60%, 25%; --accent: 175, 50%, 90%; }
        [data-theme="navy"] { --primary: 222, 47%, 31%; --accent: 222, 40%, 90%; }
        [data-theme="slate"] { --primary: 220, 20%, 18%; --accent: 220, 20%, 92%; }
        [data-theme="warm-grey"] { --primary: 30, 15%, 25%; --accent: 30, 20%, 92%; }
        [data-theme="purple"] { --primary: 260, 50%, 35%; --accent: 260, 40%, 90%; }
        [data-theme="rose"] { --primary: 340, 60%, 35%; --accent: 340, 50%, 92%; }
        [data-theme="carbon"] { --primary: 0, 0%, 15%; --accent: 0, 0%, 92%; }

        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: hsl(var(--background));
            color: hsl(var(--foreground));
            min-height: 100vh;
            transition: background 0.2s, color 0.2s;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 500;
            border: none; cursor: pointer; transition: all 0.15s ease;
        }
        .btn-primary { background: hsl(var(--primary)); color: hsl(var(--primary-foreground)); }
        .btn-primary:hover { opacity:0.9; box-shadow: 0 4px 12px hsla(var(--primary),0.3); transform:translateY(-1px); }
        .btn-outline { background:transparent; color:hsl(var(--primary)); border:2px solid hsl(var(--primary)); }
        .btn-outline:hover { background:hsl(var(--primary)); color:hsl(var(--primary-foreground)); }
        .btn-ghost { background:transparent; color:hsl(var(--foreground)); }
        .btn-ghost:hover { background:hsl(var(--accent)); }
        .btn-sm { padding: 4px 12px; font-size: 12px; }
        .btn-success { background:hsl(var(--success)); color:#fff; }
        .btn-danger { background:hsl(var(--destructive)); color:#fff; }

        .card {
            background: hsl(var(--card)); border-radius: var(--radius); border:1px solid hsl(var(--border));
            box-shadow: var(--shadow); transition: all 0.2s ease;
        }
        .card:hover { box-shadow: var(--shadow-lg); }
        .card-header { padding: 16px 20px 8px 20px; display:flex; justify-content:space-between; align-items:center; }
        .card-title { font-size:14px; font-weight:600; }
        .card-description { font-size:12px; color:hsl(var(--muted-foreground)); }
        .card-content { padding: 12px 20px 20px 20px; }

        .badge {
            display:inline-flex; align-items:center; padding:3px 10px; border-radius:20px;
            font-size:11px; font-weight:500;
        }
        .badge-success { background:hsl(var(--success)); color:#fff; }
        .badge-warning { background:hsl(var(--warning)); color:#fff; }
        .badge-primary { background:hsl(var(--primary)); color:#fff; }
        .badge-muted { background:hsl(var(--muted)); color:hsl(var(--muted-foreground)); }
        .badge-destructive { background:hsl(var(--destructive)); color:#fff; }
        .badge-secondary { background:hsl(var(--secondary)); color:#fff; }

        .avatar { width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; font-size:14px; background:hsl(var(--primary)); color:#fff; }

        .progress-bar { width:100%; height:6px; background:hsl(var(--muted)); border-radius:6px; overflow:hidden; margin-top:6px; }
        .progress-bar .fill { height:100%; border-radius:6px; transition: width 0.6s ease; background:hsl(var(--primary)); }

        .app { display:flex; min-height:100vh; }
        .sidebar {
            width: var(--sidebar-width); background:hsl(var(--sidebar-bg)); border-right:1px solid hsl(var(--sidebar-border));
            display:flex; flex-direction:column; position:fixed; top:0; left:0; bottom:0; z-index:100;
            transition:all 0.3s ease; overflow-y:auto;
        }
        .sidebar-logo { padding:20px 20px 16px 20px; display:flex; align-items:center; gap:10px; border-bottom:1px solid hsl(var(--sidebar-border)); }
        .sidebar-logo .logo-icon { width:32px; height:32px; background:hsl(var(--primary)); border-radius:var(--radius); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:700; }
        .sidebar-logo .logo-text { font-size:18px; font-weight:700; }
        .sidebar-nav { flex:1; padding:16px 12px; overflow-y:auto; }
        .sidebar-section-title { font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.5px; color:hsl(var(--muted-foreground)); padding:8px 12px 4px 12px; opacity:0.6; }
        .sidebar-item {
            display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:var(--radius);
            color:hsl(var(--muted-foreground)); cursor:pointer; transition:all 0.15s ease; font-size:14px; font-weight:500;
            border:none; background:transparent; width:100%; text-align:left;
        }
        .sidebar-item:hover { background:hsl(var(--sidebar-item-hover)); color:hsl(var(--foreground)); }
        .sidebar-item.active { background:hsl(var(--sidebar-item-active)); color:#fff; }
        .sidebar-item .icon { font-size:18px; width:24px; text-align:center; flex-shrink:0; }
        .sidebar-item .badge { margin-left:auto; }

        .main-content { margin-left:var(--sidebar-width); flex:1; min-height:100vh; display:flex; flex-direction:column; }
        .top-header {
            background:hsl(var(--card)); border-bottom:1px solid hsl(var(--border)); padding:0 32px; height:64px;
            display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:50;
        }
        .header-left { display:flex; align-items:center; gap:24px; flex:1; }
        .header-search { flex:1; max-width:400px; position:relative; margin:0 24px; }
        .header-search input { width:100%; padding:8px 12px 8px 36px; border-radius:var(--radius); border:1px solid hsl(var(--border)); background:hsl(var(--background)); font-size:13px; outline:none; }
        .header-search input:focus { border-color:hsl(var(--ring)); box-shadow:0 0 0 3px hsla(var(--ring),0.15); }
        .header-search .search-icon { position:absolute; left:10px; top:50%; transform:translateY(-50%); color:hsl(var(--muted-foreground)); }
        .header-right { display:flex; align-items:center; gap:16px; }
        .header-user { display:flex; align-items:center; gap:8px; cursor:pointer; padding:4px 8px 4px 4px; border-radius:var(--radius); }
        .header-user:hover { background:hsl(var(--accent)); }
        .header-user .user-name { font-size:13px; font-weight:500; }
        .header-user .user-role { font-size:11px; color:hsl(var(--muted-foreground)); }
        .mobile-menu-btn { display:none; background:none; border:none; font-size:24px; cursor:pointer; }

        .main-body { padding:24px 32px; flex:1; }
        .page-header { margin-bottom:24px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
        .page-header h1 { font-size:24px; font-weight:700; }
        .page-header p { font-size:14px; color:hsl(var(--muted-foreground)); margin-top:2px; }

        .stats-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:12px; margin-bottom:24px; }
        .stat-card { background:hsl(var(--card)); border-radius:var(--radius); border:1px solid hsl(var(--border)); padding:14px 16px; }
        .stat-card .stat-label { font-size:11px; font-weight:500; color:hsl(var(--muted-foreground)); text-transform:uppercase; letter-spacing:0.3px; }
        .stat-card .stat-value { font-size:20px; font-weight:700; margin-top:4px; }
        .stat-card .stat-sub { font-size:11px; color:hsl(var(--muted-foreground)); margin-top:2px; }

        .filters-bar { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px; background:hsl(var(--card)); padding:12px 16px; border-radius:var(--radius); border:1px solid hsl(var(--border)); }
        .filters-bar select, .filters-bar input { padding:6px 12px; border-radius:var(--radius); border:1px solid hsl(var(--border)); background:hsl(var(--background)); font-size:13px; outline:none; }

        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; font-size:13px; }
        th { text-align:left; padding:10px 12px; background:hsl(var(--muted)); font-weight:600; color:hsl(var(--muted-foreground)); border-bottom:2px solid hsl(var(--border)); }
        td { padding:10px 12px; border-bottom:1px solid hsl(var(--border)); vertical-align:middle; }
        tr:hover td { background:hsl(var(--accent)); }

        .compliance-status { display:flex; gap:8px; flex-wrap:wrap; }
        .compliance-item { display:flex; align-items:center; gap:6px; padding:4px 12px; border-radius:20px; font-size:12px; font-weight:500; }
        .compliance-item.compliant { background:#d1fae5; color:#065f46; }
        .compliance-item.partial { background:#fef3c7; color:#92400e; }
        .compliance-item.non-compliant { background:#fee2e2; color:#991b1b; }

        .theme-btn { padding:4px 10px; border-radius:var(--radius); border:1px solid hsl(var(--border)); background:hsl(var(--background)); cursor:pointer; font-size:12px; display:flex; align-items:center; gap:4px; }

        /* Notification Center styles */
        .notification-item {
            display:flex; gap:12px; padding:10px 0; border-bottom:1px solid hsl(var(--border));
        }
        .notification-item:last-child { border-bottom:none; }
        .notification-item .notif-icon { width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; }
        .notification-item .notif-icon.info { background:#dbeafe; color:#1e40af; }
        .notification-item .notif-icon.success { background:#d1fae5; color:#065f46; }
        .notification-item .notif-icon.warning { background:#fef3c7; color:#92400e; }
        .notification-item .notif-icon.error { background:#fee2e2; color:#991b1b; }
        .notification-item .notif-content { flex:1; }
        .notification-item .notif-content .title { font-size:13px; font-weight:500; }
        .notification-item .notif-content .desc { font-size:12px; color:hsl(var(--muted-foreground)); }
        .notification-item .notif-content .time { font-size:11px; color:hsl(var(--muted-foreground)); }
        .notification-item .notif-badge { flex-shrink:0; }

        /* Activity Feed */
        .activity-item {
            display:flex; gap:12px; padding:10px 0; border-bottom:1px solid hsl(var(--border));
        }
        .activity-item:last-child { border-bottom:none; }
        .activity-item .activity-icon { width:32px; height:32px; border-radius:var(--radius); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:14px; background:hsl(var(--muted)); }
        .activity-item .activity-content { flex:1; }
        .activity-item .activity-content .title { font-size:13px; font-weight:500; }
        .activity-item .activity-content .desc { font-size:12px; color:hsl(var(--muted-foreground)); }
        .activity-item .activity-content .time { font-size:11px; color:hsl(var(--muted-foreground)); }

        @media (max-width:1400px) { .stats-grid { grid-template-columns:repeat(4,1fr); } }
        @media (max-width:992px) {
            .sidebar { transform:translateX(-100%); width:280px; }
            .sidebar.open { transform:translateX(0); }
            .main-content { margin-left:0; }
            .top-header { padding:0 16px; }
            .main-body { padding:16px; }
            .header-search { display:none; }
            .mobile-menu-btn { display:flex !important; }
        }
        @media (max-width:768px) { .stats-grid { grid-template-columns:repeat(2,1fr); } }

        /* Tabs */
        .tabs { display:flex; gap:4px; background:hsl(var(--muted)); padding:4px; border-radius:var(--radius); }
        .tab {
            padding:6px 16px; border-radius:calc(var(--radius) - 2px); border:none; background:transparent;
            font-size:13px; font-weight:500; cursor:pointer; color:hsl(var(--muted-foreground)); transition:all 0.15s ease;
        }
        .tab:hover { color:hsl(var(--foreground)); }
        .tab.active { background:hsl(var(--card)); color:hsl(var(--foreground)); box-shadow:var(--shadow); }
    </style>
</head>
<body>
<div class="app" id="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-logo"><div class="logo-icon">🌱</div><span class="logo-text">CarbonTally</span></div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-title">Main</div>
            <button class="sidebar-item"><span class="icon">🏠</span> Dashboard</button>
            <button class="sidebar-item"><span class="icon">📁</span> Documents</button>
            <button class="sidebar-item"><span class="icon">📤</span> Upload Data</button>
            <button class="sidebar-item active"><span class="icon">📊</span> Compliance</button>
            <button class="sidebar-item" onclick="switchModule('notifications')"><span class="icon">🔔</span> Notifications <span class="badge badge-destructive">12</span></button>
            <button class="sidebar-item" onclick="switchModule('activity')"><span class="icon">📋</span> Activity Feed</button>
            <div class="sidebar-section-title" style="margin-top:16px;">Workflow</div>
            <button class="sidebar-item"><span class="icon">📂</span> Extracted Data</button>
            <button class="sidebar-item"><span class="icon">✅</span> Validation Queue</button>
        </nav>
        <div style="padding:16px 20px; border-top:1px solid hsl(var(--sidebar-border));">
            <button class="sidebar-item"><span class="icon">⚙️</span> Settings</button>
        </div>
    </aside>

    <!-- MAIN -->
    <div class="main-content">
        <header class="top-header">
            <div class="header-left">
                <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
                <div class="header-search"><span class="search-icon">🔍</span><input type="text" placeholder="Search..." id="globalSearch" /></div>
            </div>
            <div class="header-right">
                <button class="theme-btn" id="themeToggle"><i class="fas fa-palette"></i> <span id="currentThemeName">Forest</span></button>
                <div class="header-user"><div class="avatar">JD</div><div><div class="user-name">John Doe</div><div class="user-role">Admin</div></div></div>
            </div>
        </header>

        <div class="main-body" id="mainBody">
            <!-- Dynamic content rendered by JS -->
        </div>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ===== THEMES =====
        const themes = [
            { id: 'forest', name: 'Forest Green' },
            { id: 'emerald', name: 'Emerald' },
            { id: 'teal', name: 'Teal' },
            { id: 'navy', name: 'Navy' },
            { id: 'slate', name: 'Slate' },
            { id: 'warm-grey', name: 'Warm Grey' },
            { id: 'purple', name: 'Purple' },
            { id: 'rose', name: 'Rose' },
            { id: 'carbon', name: 'Carbon' }
        ];
        let currentTheme = localStorage.getItem('carbontally-theme') || 'forest';

        function setTheme(id) {
            currentTheme = id;
            document.documentElement.setAttribute('data-theme', id);
            localStorage.setItem('carbontally-theme', id);
            const t = themes.find(th => th.id === id);
            if (t) document.getElementById('currentThemeName').textContent = t.name;
        }
        setTheme(currentTheme);

        document.getElementById('themeToggle').addEventListener('click', function() {
            const idx = themes.findIndex(t => t.id === currentTheme);
            const next = (idx + 1) % themes.length;
            setTheme(themes[next].id);
        });

        // ===== MOCK DATA =====

        // Compliance data
        const complianceData = {
            secr: { status: 'compliant', score: 92, lastUpdated: '2026-01-15', findings: 2 },
            csrd: { status: 'partial', score: 68, lastUpdated: '2026-01-10', findings: 5 },
            issb: { status: 'partial', score: 71, lastUpdated: '2026-01-12', findings: 3 },
            ghg: { status: 'compliant', score: 88, lastUpdated: '2026-01-14', findings: 1 }
        };

        const emissionsData = [
            { scope: 'Scope 1', category: 'Stationary Combustion', value: 245.6, unit: 'tCO₂e', year: 2025 },
            { scope: 'Scope 1', category: 'Fugitive Emissions', value: 32.1, unit: 'tCO₂e', year: 2025 },
            { scope: 'Scope 2', category: 'Purchased Electricity', value: 312.4, unit: 'tCO₂e', year: 2025 },
            { scope: 'Scope 2', category: 'Purchased Heat', value: 45.8, unit: 'tCO₂e', year: 2025 },
            { scope: 'Scope 3', category: 'Business Travel', value: 87.3, unit: 'tCO₂e', year: 2025 },
            { scope: 'Scope 3', category: 'Supply Chain', value: 189.2, unit: 'tCO₂e', year: 2025 },
            { scope: 'Scope 3', category: 'Waste Disposal', value: 45.1, unit: 'tCO₂e', year: 2025 }
        ];

        // Notifications
        const notifications = [
            { id: 'n1', type: 'info', icon: 'fa-info-circle', title: 'SECR Report Ready', desc: 'Your SECR report for FY 2026 has been generated and is ready for review.', time: '2 hours ago', read: false },
            { id: 'n2', type: 'success', icon: 'fa-check-circle', title: 'CSRD Data Validated', desc: 'All CSRD-required data points have been validated successfully.', time: '4 hours ago', read: false },
            { id: 'n3', type: 'warning', icon: 'fa-exclamation-triangle', title: 'ISSB Data Gap Identified', desc: '3 data points are missing for ISSB compliance. Please review.', time: '1 day ago', read: true },
            { id: 'n4', type: 'error', icon: 'fa-times-circle', title: 'GHG Protocol Calculation Error', desc: 'Scope 3 Category 5 calculation failed. Please check data sources.', time: '2 days ago', read: true },
            { id: 'n5', type: 'info', icon: 'fa-bell', title: 'New Emission Factor Update', desc: 'DEFRA 2026 emission factors are now available for use.', time: '3 days ago', read: true },
            { id: 'n6', type: 'success', icon: 'fa-check-circle', title: 'Data Upload Completed', desc: 'Q4 2026 emissions data has been successfully uploaded and processed.', time: '5 days ago', read: true },
            { id: 'n7', type: 'warning', icon: 'fa-clock', title: 'Reporting Deadline Approaching', desc: 'SECR submission deadline is in 5 days. Please finalize your report.', time: '6 days ago', read: true }
        ];

        // Activity feed
        const activities = [
            { id: 'a1', icon: 'fa-file-upload', title: 'John uploaded SECR data', desc: 'File: SECR_2026_Q4.xlsx • 2.4 MB', time: '1 hour ago', user: 'John Doe' },
            { id: 'a2', icon: 'fa-check-circle', title: 'SECR report approved', desc: 'Report approved by Sustainability Officer', time: '3 hours ago', user: 'Sarah Johnson' },
            { id: 'a3', icon: 'fa-edit', title: 'CSRD data updated', desc: 'Updated Scope 3 emissions for Supply Chain', time: '5 hours ago', user: 'Mike Chen' },
            { id: 'a4', icon: 'fa-exclamation-triangle', title: 'Compliance alert triggered', desc: 'ISSB S1 disclosure missing 2 data points', time: '1 day ago', user: 'System' },
            { id: 'a5', icon: 'fa-file-pdf', title: 'GHG Protocol report generated', desc: 'Annual GHG emissions inventory report', time: '2 days ago', user: 'Emma Wilson' },
            { id: 'a6', icon: 'fa-users', title: 'Team member added to compliance', desc: 'Alex Rivera added as Compliance Analyst', time: '3 days ago', user: 'John Doe' },
            { id: 'a7', icon: 'fa-database', title: 'Emission factors updated', desc: 'DEFRA 2026 factors imported (247 new factors)', time: '4 days ago', user: 'System' },
            { id: 'a8', icon: 'fa-chart-line', title: 'Carbon trend report published', desc: 'Monthly emissions trend for Q4 2026', time: '5 days ago', user: 'Sarah Johnson' }
        ];

        // ===== RENDER FUNCTIONS =====

        function renderComplianceDashboard() {
            const secr = complianceData.secr;
            const csrd = complianceData.csrd;
            const issb = complianceData.issb;
            const ghg = complianceData.ghg;

            const statusBadge = (s) => {
                if (s === 'compliant') return '<span class="badge badge-success"><i class="fas fa-check"></i> Compliant</span>';
                if (s === 'partial') return '<span class="badge badge-warning"><i class="fas fa-exclamation-triangle"></i> Partial</span>';
                return '<span class="badge badge-destructive"><i class="fas fa-times"></i> Non-Compliant</span>';
            };

            const html = `
                <div class="page-header">
                    <div><h1>📊 Compliance Dashboard</h1><p>Real-time compliance status for all regulatory frameworks.</p></div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-primary btn-sm"><i class="fas fa-file-export"></i> Export Report</button>
                        <button class="btn btn-outline btn-sm"><i class="fas fa-sync-alt"></i> Refresh</button>
                    </div>
                </div>

                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-label">📋 Overall Compliance</div><div class="stat-value">82%</div><div class="stat-sub">4 frameworks tracked</div></div>
                    <div class="stat-card"><div class="stat-label">✅ Compliant</div><div class="stat-value">2</div><div class="stat-sub">SECR, GHG Protocol</div></div>
                    <div class="stat-card"><div class="stat-label">⚠️ Partial</div><div class="stat-value">2</div><div class="stat-sub">CSRD, ISSB</div></div>
                    <div class="stat-card"><div class="stat-label">📅 Last Update</div><div class="stat-value">${secr.lastUpdated}</div><div class="stat-sub">All frameworks</div></div>
                    <div class="stat-card"><div class="stat-label">🔍 Findings</div><div class="stat-value">11</div><div class="stat-sub">Total open issues</div></div>
                    <div class="stat-card"><div class="stat-label">📈 Emission Trend</div><div class="stat-value">-3.2%</div><div class="stat-sub">vs previous year</div></div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
                    <div class="card">
                        <div class="card-header"><div class="card-title">📋 SECR</div></div>
                        <div class="card-content">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <div>${statusBadge(secr.status)}</div>
                                <span style="font-size:24px;font-weight:700;color:hsl(var(--primary));">${secr.score}%</span>
                            </div>
                            <div class="progress-bar" style="margin-top:8px;"><div class="fill" style="width:${secr.score}%;"></div></div>
                            <div style="margin-top:8px;font-size:12px;color:hsl(var(--muted-foreground));">
                                <span>Last updated: ${secr.lastUpdated}</span> • <span>${secr.findings} findings</span>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><div class="card-title">📋 CSRD</div></div>
                        <div class="card-content">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <div>${statusBadge(csrd.status)}</div>
                                <span style="font-size:24px;font-weight:700;color:hsl(var(--warning));">${csrd.score}%</span>
                            </div>
                            <div class="progress-bar" style="margin-top:8px;"><div class="fill" style="width:${csrd.score}%;background:hsl(var(--warning));"></div></div>
                            <div style="margin-top:8px;font-size:12px;color:hsl(var(--muted-foreground));">
                                <span>Last updated: ${csrd.lastUpdated}</span> • <span>${csrd.findings} findings</span>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><div class="card-title">📋 ISSB</div></div>
                        <div class="card-content">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <div>${statusBadge(issb.status)}</div>
                                <span style="font-size:24px;font-weight:700;color:hsl(var(--warning));">${issb.score}%</span>
                            </div>
                            <div class="progress-bar" style="margin-top:8px;"><div class="fill" style="width:${issb.score}%;background:hsl(var(--warning));"></div></div>
                            <div style="margin-top:8px;font-size:12px;color:hsl(var(--muted-foreground));">
                                <span>Last updated: ${issb.lastUpdated}</span> • <span>${issb.findings} findings</span>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><div class="card-title">📋 GHG Protocol</div></div>
                        <div class="card-content">
                            <div style="display:flex;justify-content:space-between;align-items:center;">
                                <div>${statusBadge(ghg.status)}</div>
                                <span style="font-size:24px;font-weight:700;color:hsl(var(--primary));">${ghg.score}%</span>
                            </div>
                            <div class="progress-bar" style="margin-top:8px;"><div class="fill" style="width:${ghg.score}%;"></div></div>
                            <div style="margin-top:8px;font-size:12px;color:hsl(var(--muted-foreground));">
                                <span>Last updated: ${ghg.lastUpdated}</span> • <span>${ghg.findings} findings</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header"><div class="card-title">📊 Emissions by Scope</div></div>
                    <div class="card-content">
                        <div class="table-wrap">
                            <table>
                                <thead><tr><th>Scope</th><th>Category</th><th>Value</th><th>Unit</th><th>Year</th></tr></thead>
                                <tbody>
                                    ${emissionsData.map(e => `<tr><td><span class="badge badge-primary">${e.scope}</span></td><td>${e.category}</td><td>${e.value}</td><td>${e.unit}</td><td>${e.year}</td></tr>`).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            `;
            document.getElementById('mainBody').innerHTML = html;
        }

        function renderNotifications() {
            const unreadCount = notifications.filter(n => !n.read).length;
            const html = `
                <div class="page-header">
                    <div><h1>🔔 Notification Center</h1><p>${unreadCount} unread notifications</p></div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-primary btn-sm"><i class="fas fa-check-double"></i> Mark All Read</button>
                        <button class="btn btn-outline btn-sm"><i class="fas fa-cog"></i> Settings</button>
                    </div>
                </div>

                <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:24px;">
                    <div class="stat-card"><div class="stat-label">📬 Total Notifications</div><div class="stat-value">${notifications.length}</div></div>
                    <div class="stat-card"><div class="stat-label">🔴 Unread</div><div class="stat-value">${unreadCount}</div></div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title">📋 All Notifications</div>
                        <div style="display:flex;gap:8px;">
                            <button class="btn btn-sm btn-ghost">All</button>
                            <button class="btn btn-sm btn-ghost">Unread</button>
                            <button class="btn btn-sm btn-ghost">Read</button>
                        </div>
                    </div>
                    <div class="card-content">
                        ${notifications.map(n => `
                            <div class="notification-item" style="${n.read ? 'opacity:0.7;' : ''}">
                                <div class="notif-icon ${n.type}"><i class="fas ${n.icon}"></i></div>
                                <div class="notif-content">
                                    <div class="title">${n.title}</div>
                                    <div class="desc">${n.desc}</div>
                                    <div class="time"><i class="far fa-clock"></i> ${n.time}</div>
                                </div>
                                <div class="notif-badge">
                                    ${n.read ? '<span class="badge badge-muted">Read</span>' : '<span class="badge badge-destructive">Unread</span>'}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('mainBody').innerHTML = html;
        }

        function renderActivityFeed() {
            const html = `
                <div class="page-header">
                    <div><h1>📋 Activity Feed</h1><p>Real-time activity timeline across your organization.</p></div>
                    <div style="display:flex;gap:8px;flex-wrap:wrap;">
                        <button class="btn btn-primary btn-sm"><i class="fas fa-filter"></i> Filter</button>
                        <button class="btn btn-outline btn-sm"><i class="fas fa-sync-alt"></i> Refresh</button>
                    </div>
                </div>

                <div class="filters-bar">
                    <select><option>All Activities</option><option>Documents</option><option>Compliance</option><option>Users</option><option>System</option></select>
                    <input type="date" /> <span style="color:hsl(var(--muted-foreground));font-size:12px;">to</span> <input type="date" />
                    <button class="btn btn-sm btn-primary">Apply</button>
                </div>

                <div class="card">
                    <div class="card-header">
                        <div class="card-title">🕐 Recent Activity</div>
                        <span class="badge badge-primary">${activities.length} events</span>
                    </div>
                    <div class="card-content">
                        ${activities.map(a => `
                            <div class="activity-item">
                                <div class="activity-icon"><i class="fas ${a.icon}"></i></div>
                                <div class="activity-content">
                                    <div class="title">${a.title}</div>
                                    <div class="desc">${a.desc}</div>
                                    <div class="time"><i class="far fa-user"></i> ${a.user} · <i class="far fa-clock"></i> ${a.time}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            document.getElementById('mainBody').innerHTML = html;
        }

        // ===== MODULE SWITCHER =====
        let currentModule = 'compliance';

        window.switchModule = function(module) {
            currentModule = module;
            document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
            const items = document.querySelectorAll('.sidebar-item');
            if (module === 'compliance') items[3].classList.add('active');
            else if (module === 'notifications') items[4].classList.add('active');
            else if (module === 'activity') items[5].classList.add('active');

            if (module === 'compliance') renderComplianceDashboard();
            else if (module === 'notifications') renderNotifications();
            else if (module === 'activity') renderActivityFeed();

            // Close mobile sidebar
            if (window.innerWidth <= 992) {
                document.getElementById('sidebar').classList.remove('open');
            }
        };

        // ===== INIT =====
        document.getElementById('mobileMenuBtn').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('open');
        });

        // Set active sidebar item
        document.querySelectorAll('.sidebar-item')[3].classList.add('active'); // Compliance

        // Render initial module
        renderComplianceDashboard();

        // Handle sidebar item clicks for navigation
        document.querySelectorAll('.sidebar-item').forEach((item, index) => {
            item.addEventListener('click', function() {
                if (index === 3) switchModule('compliance');
                else if (index === 4) switchModule('notifications');
                else if (index === 5) switchModule('activity');
            });
        });

        // Search handler
        document.getElementById('globalSearch').addEventListener('keyup', function(e) {
            if (e.key === 'Enter') {
                alert('🔍 Searching for: ' + this.value);
            }
        });

        console.log('🌱 CarbonTally - High Priority Modules Loaded');
        console.log('📊 Compliance Dashboard, Notification Center, Activity Feed');
    })();
</script>
</body>
</html>
