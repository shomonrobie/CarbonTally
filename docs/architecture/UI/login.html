<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarbonTally - Login</title>
    <style>
        /* ============================================
           THEME SYSTEM
           ============================================ */
        :root {
            --primary: 150, 50%, 28%;
            --primary-foreground: 0, 0%, 100%;
            --secondary: 220, 14%, 45%;
            --secondary-foreground: 0, 0%, 100%;
            --accent: 150, 30%, 92%;
            --accent-foreground: 150, 50%, 28%;
            --muted: 220, 15%, 96%;
            --muted-foreground: 220, 14%, 45%;
            --background: 0, 0%, 100%;
            --foreground: 220, 20%, 18%;
            --card: 0, 0%, 100%;
            --card-foreground: 220, 20%, 18%;
            --border: 220, 15%, 90%;
            --ring: 150, 50%, 28%;
            --success: 150, 30%, 35%;
            --warning: 38, 60%, 45%;
            --destructive: 0, 50%, 40%;
            --radius: 8px;
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.08);
            --shadow-xl: 0 20px 60px rgba(0,0,0,0.12);
            --transition-speed: 0.3s;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: hsl(var(--background));
            color: hsl(var(--foreground));
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* ============================================
           shadcn/ui COMPONENTS
           ============================================ */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.15s ease;
            width: 100%;
        }
        .btn:active { transform: scale(0.98); }

        .btn-primary {
            background: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }
        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px hsla(var(--primary), 0.3);
        }

        .btn-secondary {
            background: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
        }
        .btn-secondary:hover { opacity: 0.85; }

        .btn-outline {
            background: transparent;
            color: hsl(var(--primary));
            border: 2px solid hsl(var(--primary));
        }
        .btn-outline:hover {
            background: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }

        .input {
            padding: 10px 14px;
            border-radius: var(--radius);
            border: 1px solid hsl(var(--border));
            background: hsl(var(--background));
            color: hsl(var(--foreground));
            font-size: 14px;
            outline: none;
            transition: all 0.15s ease;
            width: 100%;
        }
        .input:focus {
            border-color: hsl(var(--ring));
            box-shadow: 0 0 0 3px hsla(var(--ring), 0.15);
        }

        .card {
            background: hsl(var(--card));
            border-radius: var(--radius);
            border: 1px solid hsl(var(--border));
            box-shadow: var(--shadow);
            padding: 32px;
            max-width: 420px;
            width: 95%;
        }
        .card:hover { box-shadow: var(--shadow-lg); }

        .badge {
            display: inline-flex;
            align-items: center;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
        }
        .badge-success {
            background: hsl(var(--success));
            color: hsl(var(--primary-foreground));
        }
        .badge-warning {
            background: hsl(var(--warning));
            color: hsl(var(--primary-foreground));
        }
        .badge-muted {
            background: hsl(var(--muted));
            color: hsl(var(--muted-foreground));
        }
        .badge-primary {
            background: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }
        .badge-destructive {
            background: hsl(var(--destructive));
            color: hsl(var(--primary-foreground));
        }

        /* ============================================
           LOGIN STYLES
           ============================================ */
        .login-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 24px;
        }

        .login-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 700;
            color: hsl(var(--foreground));
            margin-bottom: 8px;
        }
        .login-logo .logo-icon {
            width: 48px;
            height: 48px;
            background: hsl(var(--primary));
            border-radius: var(--radius);
            display: flex;
            align-items: center;
            justify-content: center;
            color: hsl(var(--primary-foreground));
            font-size: 24px;
        }

        .login-title {
            font-size: 20px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
        }
        .login-subtitle {
            font-size: 14px;
            color: hsl(var(--muted-foreground));
            text-align: center;
            margin-bottom: 20px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .form-group label {
            font-size: 13px;
            font-weight: 500;
            color: hsl(var(--foreground));
        }

        .role-selector {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
            gap: 6px;
            margin: 8px 0 4px 0;
        }

        .role-btn {
            padding: 8px 4px;
            border-radius: var(--radius);
            border: 2px solid hsl(var(--border));
            background: hsl(var(--background));
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            font-size: 11px;
            font-weight: 500;
            color: hsl(var(--muted-foreground));
        }
        .role-btn:hover {
            border-color: hsl(var(--ring));
            background: hsl(var(--accent));
        }
        .role-btn.active {
            border-color: hsl(var(--primary));
            background: hsl(var(--accent));
            color: hsl(var(--foreground));
        }
        .role-btn .icon { font-size: 20px; display: block; margin-bottom: 2px; }
        .role-btn .label { font-size: 10px; }
        .role-btn .badge { font-size: 8px; padding: 1px 6px; }

        .login-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: hsl(var(--muted-foreground));
            margin-top: 4px;
        }
        .login-footer a {
            color: hsl(var(--primary));
            text-decoration: none;
        }
        .login-footer a:hover { text-decoration: underline; }

        .demo-hint {
            padding: 12px 16px;
            border-radius: var(--radius);
            background: hsl(var(--accent));
            border: 1px solid hsl(var(--border));
            font-size: 13px;
            color: hsl(var(--foreground));
            text-align: center;
        }
        .demo-hint strong { color: hsl(var(--primary)); }

        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: hsl(var(--card));
            border: 1px solid hsl(var(--border));
            border-radius: var(--radius);
            padding: 12px 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            transform: translateY(120px);
            opacity: 0;
            transition: all 0.4s ease;
            z-index: 2000;
            max-width: 450px;
        }
        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }
        .toast .icon { font-size: 18px; }
        .toast .message {
            font-size: 13px;
            color: hsl(var(--foreground));
        }

        /* Responsive */
        @media (max-width: 480px) {
            .role-selector {
                grid-template-columns: 1fr 1fr 1fr;
            }
            .card { padding: 20px; }
            .login-logo { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="login-container">

            <!-- Logo -->
            <div class="login-logo">
                <div class="logo-icon">🌱</div>
                <span>CarbonTally</span>
            </div>

            <!-- Title -->
            <div>
                <div class="login-title">Welcome Back</div>
                <div class="login-subtitle">Sign in to your CarbonTally dashboard</div>
            </div>

            <!-- Login Form -->
            <form class="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" class="input" id="emailInput" placeholder="Enter your email" value="admin@carbontally.com" />
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="input" id="passwordInput" placeholder="Enter your password" value="password123" />
                </div>

                <div class="form-group">
                    <label>Select Role (Demo)</label>
                    <div class="role-selector" id="roleSelector">
                        <button type="button" class="role-btn active" data-role="admin" onclick="selectRole('admin')">
                            <span class="icon">👑</span>
                            <span class="label">Admin</span>
                            <span class="badge badge-destructive">Full</span>
                        </button>
                        <button type="button" class="role-btn" data-role="manager" onclick="selectRole('manager')">
                            <span class="icon">📋</span>
                            <span class="label">Manager</span>
                            <span class="badge badge-warning">High</span>
                        </button>
                        <button type="button" class="role-btn" data-role="analyst" onclick="selectRole('analyst')">
                            <span class="icon">📊</span>
                            <span class="label">Analyst</span>
                            <span class="badge badge-primary">Med</span>
                        </button>
                        <button type="button" class="role-btn" data-role="staff" onclick="selectRole('staff')">
                            <span class="icon">👤</span>
                            <span class="label">Staff</span>
                            <span class="badge badge-muted">Basic</span>
                        </button>
                        <button type="button" class="role-btn" data-role="viewer" onclick="selectRole('viewer')">
                            <span class="icon">👁️</span>
                            <span class="label">Viewer</span>
                            <span class="badge badge-muted">Read</span>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary">
                    🔐 Sign In
                </button>
            </form>

            <!-- Demo Hint -->
            <div class="demo-hint">
                💡 <strong>Demo Mode:</strong> Select a role above and click "Sign In"<br />
                <span style="font-size:12px;">No actual authentication required</span>
            </div>

            <!-- Footer -->
            <div class="login-footer">
                <a href="#">Forgot password?</a>
                <span>|</span>
                <a href="#">Create account</a>
            </div>

        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <span class="icon">✅</span>
        <span class="message" id="toastMessage">Login successful!</span>
    </div>

    <script>
        // ============================================
        // STATE
        // ============================================
        let selectedRole = 'admin';

        // ============================================
        // USER MOCK DATA
        // ============================================
        const mockUsers = {
            admin: {
                id: 'user_001',
                name: 'John Doe',
                email: 'admin@carbontally.com',
                role: 'admin',
                dashboard: 'dashboard_admin.html',
                avatar: 'JD',
                organization: 'CarbonTally Ltd',
                permissions: ['full_access']
            },
            manager: {
                id: 'user_002',
                name: 'Sarah Johnson',
                email: 'sarah@carbontally.com',
                role: 'manager',
                dashboard: 'dashboard_manager.html',
                avatar: 'SJ',
                organization: 'CarbonTally Ltd',
                permissions: ['view_all', 'edit_data', 'manage_team']
            },
            analyst: {
                id: 'user_003',
                name: 'Mike Roberts',
                email: 'mike@carbontally.com',
                role: 'analyst',
                dashboard: 'dashboard_analyst.html',
                avatar: 'MR',
                organization: 'CarbonTally Ltd',
                permissions: ['view_all', 'edit_data']
            },
            staff: {
                id: 'user_004',
                name: 'Anna Liu',
                email: 'anna@carbontally.com',
                role: 'staff',
                dashboard: 'dashboard_staff.html',
                avatar: 'AL',
                organization: 'CarbonTally Ltd',
                permissions: ['view_all', 'edit_data', 'upload_files']
            },
            viewer: {
                id: 'user_005',
                name: 'Tom Chen',
                email: 'tom@carbontally.com',
                role: 'viewer',
                dashboard: 'dashboard_viewer.html',
                avatar: 'TC',
                organization: 'CarbonTally Ltd',
                permissions: ['view_all']
            }
        };

        // ============================================
        // FUNCTIONS
        // ============================================

        function selectRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.role === role);
            });

            // Update email based on role
            const emailMap = {
                admin: 'admin@carbontally.com',
                manager: 'sarah@carbontally.com',
                analyst: 'mike@carbontally.com',
                staff: 'anna@carbontally.com',
                viewer: 'tom@carbontally.com'
            };
            document.getElementById('emailInput').value = emailMap[role] || 'user@carbontally.com';

            showToast(`👤 Switched to ${role.charAt(0).toUpperCase() + role.slice(1)} role`);
        }

        function handleLogin(e) {
            e.preventDefault();

            const email = document.getElementById('emailInput').value.trim();
            const password = document.getElementById('passwordInput').value.trim();

            if (!email || !password) {
                showToast('⚠️ Please enter both email and password', 'warning');
                return;
            }

            // Find user by email (mock)
            let user = null;
            let role = selectedRole;

            // Try to find user by email in mock data
            for (const [key, value] of Object.entries(mockUsers)) {
                if (value.email === email) {
                    user = value;
                    role = key;
                    break;
                }
            }

            // If not found by email, use selected role
            if (!user) {
                user = mockUsers[role];
                // Update email in mock
                user.email = email;
            }

            // Store user in session
            sessionStorage.setItem('carbontally_user', JSON.stringify(user));
            sessionStorage.setItem('carbontally_role', role);

            showToast(`✅ Welcome back, ${user.name}! Redirecting...`);

            // Redirect after delay
            setTimeout(() => {
                window.location.href = user.dashboard;
            }, 1500);
        }

        function showToast(message, type = 'success') {
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️',
                info: 'ℹ️'
            };
            document.querySelector('.toast .icon').textContent = icons[type] || icons.info;
            document.getElementById('toastMessage').textContent = message;
            const toast = document.getElementById('toast');
            toast.classList.add('show');
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3500);
        }

        // ============================================
        // KEYBOARD SHORTCUTS
        // ============================================
        document.addEventListener('keydown', function(e) {
            // Enter to submit
            if (e.key === 'Enter') {
                e.preventDefault();
                document.querySelector('.btn-primary').click();
            }

            // Number keys to select roles (1-5)
            if (e.key >= '1' && e.key <= '5') {
                const roles = ['admin', 'manager', 'analyst', 'staff', 'viewer'];
                const index = parseInt(e.key) - 1;
                if (index < roles.length) {
                    selectRole(roles[index]);
                }
            }
        });

        // ============================================
        // CONSOLE
        // ============================================
        console.log('🌱 CarbonTally - Login Page');
        console.log('👤 Select a role from the buttons above');
        console.log('⌨️  Press 1-5 to quickly switch roles');
        console.log('  1: Admin  👑');
        console.log('  2: Manager 📋');
        console.log('  3: Analyst 📊');
        console.log('  4: Staff   👤');
        console.log('  5: Viewer  👁️');
        console.log('🔐 Click "Sign In" to access the dashboard');
    </script>

</body>
</html>
