<!-- Document Management Module - SPA Compatible -->
<div class="main-body">

    <!-- Breadcrumb -->
    <div class="breadcrumb">
        <span>📁 Documents</span>
    </div>

    <!-- Module Header -->
    <div class="page-header">
        <div>
            <h1>📁 Document Management</h1>
            <p>Manage all your carbon emissions documents and records</p>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" onclick="showUploadModal()">
                📤 Upload Document
            </button>
            <button class="btn btn-outline btn-sm" onclick="toggleView()">
                📋 Toggle View
            </button>
        </div>
    </div>

    <!-- Document Stats -->
    <div class="doc-stats" id="docStats">
        <div class="doc-stat">
            <span class="icon">📄</span>
            <div class="value" id="statTotal">0</div>
            <div class="label">Total Documents</div>
        </div>
        <div class="doc-stat">
            <span class="icon">📤</span>
            <div class="value" id="statUploaded">0</div>
            <div class="label">Uploaded</div>
        </div>
        <div class="doc-stat">
            <span class="icon">⏳</span>
            <div class="value" id="statProcessing">0</div>
            <div class="label">Processing</div>
        </div>
        <div class="doc-stat">
            <span class="icon">📝</span>
            <div class="value" id="statReview">0</div>
            <div class="label">In Review</div>
        </div>
        <div class="doc-stat">
            <span class="icon">✅</span>
            <div class="value" id="statApproved">0</div>
            <div class="label">Approved</div>
        </div>
        <div class="doc-stat">
            <span class="icon">❌</span>
            <div class="value" id="statRejected">0</div>
            <div class="label">Rejected</div>
        </div>
    </div>

    <!-- Filters -->
    <div class="filters-bar">
        <div class="tabs" id="statusFilter">
            <button class="tab active" data-status="all" onclick="filterByStatus('all')">All</button>
            <button class="tab" data-status="uploaded" onclick="filterByStatus('uploaded')">📤 Uploaded</button>
            <button class="tab" data-status="processing" onclick="filterByStatus('processing')">⏳ Processing</button>
            <button class="tab" data-status="review" onclick="filterByStatus('review')">📝 Review</button>
            <button class="tab" data-status="approved" onclick="filterByStatus('approved')">✅ Approved</button>
            <button class="tab" data-status="rejected" onclick="filterByStatus('rejected')">❌ Rejected</button>
        </div>
        <div style="flex:1;min-width:150px;">
            <select class="select" id="typeFilter" onchange="applyFilters()" style="padding:4px 8px;font-size:12px;">
                <option value="all">All Types</option>
                <option value="fuel">⛽ Fuel</option>
                <option value="utility">💡 Utility</option>
                <option value="scope3">🌍 Scope 3</option>
                <option value="document">📄 Document</option>
            </select>
        </div>
        <div style="display:flex;gap:4px;">
            <button class="btn btn-ghost btn-sm" onclick="clearFilters()">↺ Clear</button>
            <span class="badge badge-muted" id="docCount">0 documents</span>
        </div>
    </div>

    <!-- Document List -->
    <div id="documentsContainer">
        <div class="doc-grid" id="docGrid">
            <!-- Rendered by JS -->
        </div>
    </div>

    <!-- Pagination -->
    <div class="pagination" id="pagination">
        <!-- Rendered by JS -->
    </div>

</div>

<!-- ===== UPLOAD MODAL ===== -->
<div class="modal-overlay" id="uploadModal">
    <div class="modal-box">
        <div class="modal-header">
            <div>
                <div class="modal-title">📤 Upload Document</div>
                <div style="font-size:13px;color:hsl(var(--muted-foreground));margin-top:4px;">
                    Add a new document to the system
                </div>
            </div>
            <button class="modal-close" onclick="closeUploadModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="settings-group">
                <label>Document Name <span style="color:hsl(var(--destructive));">*</span></label>
                <input type="text" id="docName" placeholder="e.g., Utility_Bill_London_Dec2026.pdf" />
            </div>
            <div class="settings-group">
                <label>Document Type <span style="color:hsl(var(--destructive));">*</span></label>
                <select id="docType">
                    <option value="fuel">⛽ Fuel</option>
                    <option value="utility">💡 Utility</option>
                    <option value="scope3">🌍 Scope 3</option>
                    <option value="document">📄 Document</option>
                </select>
            </div>
            <div class="settings-group">
                <label>Status</label>
                <select id="docStatus">
                    <option value="uploaded">📤 Uploaded</option>
                    <option value="processing">⏳ Processing</option>
                    <option value="review">📝 Review</option>
                    <option value="approved">✅ Approved</option>
                    <option value="rejected">❌ Rejected</option>
                </select>
            </div>
            <div class="settings-group">
                <label>File Size (MB)</label>
                <input type="number" id="docSize" placeholder="e.g., 2.4" step="0.1" min="0.1" value="1.0" />
            </div>
            <div class="settings-group">
                <label>Records</label>
                <input type="number" id="docRecords" placeholder="e.g., 12" min="0" value="0" />
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-ghost" onclick="closeUploadModal()">Cancel</button>
            <button class="btn btn-primary" onclick="uploadDocument()">📤 Upload</button>
        </div>
    </div>
</div>

<!-- ===== DOCUMENT DETAIL MODAL ===== -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-box">
        <div class="modal-header">
            <div>
                <div class="modal-title" id="detailTitle">📄 Document Details</div>
                <div style="font-size:13px;color:hsl(var(--muted-foreground));margin-top:4px;" id="detailSubtitle">View document information</div>
            </div>
            <button class="modal-close" onclick="closeDetailModal()">✕</button>
        </div>
        <div class="modal-body" id="detailBody">
            <!-- Rendered by JS -->
        </div>
        <div class="modal-footer" id="detailFooter">
            <!-- Rendered by JS -->
        </div>
    </div>
</div>
